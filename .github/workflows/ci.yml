name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true}
      - uses: pnpm/action-setup@v4
        with: {version: 10.2.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose ps
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://backlog_runtime:local-runtime-password@127.0.0.1:55432/backlog_killer?sslmode=disable
      - run: go vet ./...
      - run: pnpm check:generated && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm exec playwright test
      - name: Verify restart readiness
        run: docker compose restart api && timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:18080/readyz; do sleep 1; done'
      - name: Verify on-prem bootstrap profile
        env:
          DEPLOYMENT_MODE: onprem
          LOCAL_DEMO_SEED: "false"
          ONPREM_TENANT_NAME: CI Tenant
          ONPREM_PROJECT_NAME: CI Project
          ONPREM_PROJECT_KEY: ci-project
          ONPREM_OWNER_SUBJECT: ci-owner
          ONPREM_OWNER_EMAIL: ci-owner@example.test
          ONPREM_PROJECT_ORIGIN: https://product.example.test
        run: docker compose up -d api && timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:18080/readyz; do sleep 1; done'
      - run: pnpm audit --prod --audit-level=high
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Smoke production profile
        env:
          API_PUBLIC_HOST: api.localhost
          WEB_PUBLIC_HOST: backlog.localhost
          OIDC_PUBLIC_HOST: identity.localhost
          POSTGRES_MIGRATION_USER: backlog_migrator
          POSTGRES_MIGRATION_PASSWORD: ci-migration-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-secret
          KEYCLOAK_DB_PASSWORD: ci-keycloak-db-secret
          POSTGRES_PASSWORD: ci-runtime-secret
          KEYCLOAK_ADMIN_USERNAME: admin
          DEPLOYMENT_MODE: saas
          EMBED_SIGNING_KEY: 0123456789abcdef0123456789abcdef
          PLATFORM_ADMIN_SUBJECTS: https://identity.localhost/realms/backlog-killer|ci-owner-subject
        run: |
          docker compose down -v
          docker compose -f docker-compose.yml -f compose.production.yml config --quiet
          docker compose -f docker-compose.yml -f compose.production.yml up --build -d
          timeout 180 sh -c 'until curl --insecure --fail --silent --resolve api.localhost:443:127.0.0.1 https://api.localhost/readyz; do sleep 2; done'
          curl --insecure --fail --silent --resolve backlog.localhost:443:127.0.0.1 https://backlog.localhost/ >/dev/null
          curl --insecure --fail --silent --resolve identity.localhost:443:127.0.0.1 https://identity.localhost/realms/backlog-killer/.well-known/openid-configuration >/dev/null
          docker compose -f docker-compose.yml -f compose.production.yml restart api
          timeout 90 sh -c 'until curl --insecure --fail --silent --resolve api.localhost:443:127.0.0.1 https://api.localhost/readyz; do sleep 2; done'
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.production.yml logs --no-color api web keycloak keycloak-postgres postgres proxy
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.production.yml down -v
