openapi: 3.1.0
info: {title: Backlog Killer API, version: 1.0.0}
servers: [{url: https://api.example.test/v1}]
security: [{bearerAuth: []}]
paths:
  /me: {get: {operationId: getMe, responses: {'200': {description: Identity,content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}, default: {$ref: '#/components/responses/Error'}}}}
  /tenants:
    post: {operationId: createTenant, requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/CreateTenant'}}}}, responses: {'201': {description: Project,content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSettings'}}}}, default: {$ref: '#/components/responses/Error'}}}
  /projects: {post: {operationId: createProject, requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/CreateProject'}}}}, responses: {'201': {description: Project,content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSettings'}}}}, default: {$ref: '#/components/responses/Error'}}}}
  /invitations/accept:
    post: {operationId: acceptInvitation, requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/AcceptInvitation'}}}}, responses: {'200': {description: Membership,content: {application/json: {schema: {$ref: '#/components/schemas/ProjectMembership'}}}}, default: {$ref: '#/components/responses/Error'}}}
  /embed/token:
    post: {operationId: exchangeEmbedCode,security: [],parameters: [{name: project_key,in: query,required: true,schema: {type: string}}],requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/EmbedTokenRequest'}}}},responses: {'200': {description: Short-lived embed token,content: {application/json: {schema: {$ref: '#/components/schemas/EmbedTokenResponse'}}}},default: {$ref: '#/components/responses/Error'}}}
  /projects/{projectId}/tickets:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listTickets
      parameters: [{name: status, in: query, schema: {type: array, items: {$ref: '#/components/schemas/TicketStatus'}}}, {name: page, in: query, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}]
      responses: {'200': {description: Tickets, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}, nextCursor: {type: [string,'null']}}}}}}, default: {$ref: '#/components/responses/Error'}}
    post: {operationId: createTicket, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTicket'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}, default: {$ref: '#/components/responses/Error'}}}
  /projects/{projectId}/tickets/{ticketId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/TicketId'}]
    get: {operationId: getTicket, responses: {'200': {description: Detail, content: {application/json: {schema: {$ref: '#/components/schemas/TicketDetail'}}}}, default: {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateTicket, parameters: [{$ref: '#/components/parameters/IfMatch'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTicket'}}}}, responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteTicket, parameters: [{$ref: '#/components/parameters/IfMatch'}], responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}
  /projects/{projectId}/tickets/{ticketId}/restore: {post: {operationId: restoreTicket, parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/TicketId'},{$ref: '#/components/parameters/IfMatch'}], responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/tickets/{ticketId}/transition: {post: {operationId: transitionTicket, parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/TicketId'},{$ref: '#/components/parameters/IfMatch'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/tickets/{ticketId}/comments: {post: {operationId: commentTicket, parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/TicketId'},{$ref: '#/components/parameters/IfMatch'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/tickets/bulk: {post: {operationId: bulkTickets, parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/tickets/{ticketId}/attachments: {post: {operationId: uploadAttachment, parameters: [{$ref: '#/components/parameters/ProjectId'},{$ref: '#/components/parameters/TicketId'}], requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string,format: binary}}}}}}, responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/attachments/{attachmentId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'},{name: attachmentId,in: path,required: true,schema: {type: string,format: uuid}}]
    get: {operationId: downloadAttachment, responses: {'200': {description: Attachment}, default: {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteAttachment, responses: {'204': {description: Deleted}, default: {$ref: '#/components/responses/Error'}}}
  /projects/{projectId}/agent-batches:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {operationId: listBatches, responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}
    post: {operationId: claimBatch, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}
  /projects/{projectId}/agent-batches/{batchId}: {delete: {operationId: unassignBatch, parameters: [{$ref: '#/components/parameters/ProjectId'},{name: batchId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'204': {description: Unassigned}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/source: {get: {operationId: getProjectSource, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/settings: {get: {operationId: getProjectSettings, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Project settings,content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSettings'}}}}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/origins: {post: {operationId: addOrigin, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/Origin'}}}}, responses: {'201': {description: Origin,content: {application/json: {schema: {$ref: '#/components/schemas/Origin'}}}}, default: {$ref: '#/components/responses/Error'}}}, delete: {operationId: removeOrigin, parameters: [{$ref: '#/components/parameters/ProjectId'},{name: origin,in: query,required: true,schema: {type: string,format: uri}}], responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/invitations: {post: {operationId: createInvitation, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/CreateInvitation'}}}}, responses: {'201': {description: Invitation,content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/members/{userId}: {patch: {operationId: updateMember, parameters: [{$ref: '#/components/parameters/ProjectId'},{name: userId,in: path,required: true,schema: {type: string,format: uuid}}], requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMember'}}}}, responses: {'204': {description: Updated}, default: {$ref: '#/components/responses/Error'}}}, delete: {operationId: removeMember, parameters: [{$ref: '#/components/parameters/ProjectId'},{name: userId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/agent-tokens: {get: {operationId: listAgentTokens, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Tokens,content: {application/json: {schema: {type: object,required: [items],properties: {items: {type: array,items: {$ref: '#/components/schemas/TokenInfo'}}}}}}}, default: {$ref: '#/components/responses/Error'}}}, post: {operationId: createAgentToken, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {required: true,content: {application/json: {schema: {$ref: '#/components/schemas/CreateToken'}}}}, responses: {'201': {description: Token secret,content: {application/json: {schema: {$ref: '#/components/schemas/TokenSecret'}}}}, default: {$ref: '#/components/responses/Error'}}}}
  /projects/{projectId}/agent-tokens/{tokenId}: {delete: {operationId: revokeAgentToken, parameters: [{$ref: '#/components/parameters/ProjectId'},{name: tokenId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'204': {description: Revoked}, default: {$ref: '#/components/responses/Error'}}}}
components:
  securitySchemes: {bearerAuth: {type: http,scheme: bearer}}
  parameters:
    ProjectId: {name: projectId,in: path,required: true,schema: {type: string,format: uuid}}
    TicketId: {name: ticketId,in: path,required: true,schema: {type: string,format: uuid}}
    IfMatch: {name: If-Match,in: header,required: true,schema: {type: string,pattern: '^"[1-9][0-9]*"$'}}
    IdempotencyKey: {name: Idempotency-Key,in: header,required: true,schema: {type: string,minLength: 8,maxLength: 200}}
  requestBodies: {JSON: {required: true,content: {application/json: {schema: {type: object,additionalProperties: true}}}}}
  responses:
    JSON: {description: JSON response,content: {application/json: {schema: {type: object,additionalProperties: true}}}}
    Error: {description: Error,content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    TicketStatus: {type: string,enum: [new,needs_clarification,in_progress,review,rework,done,deleted]}
    Page: {type: object,required: [urlPath,title],properties: {urlPath: {type: string,pattern: '^/'},urlPattern: {type: string},title: {type: string,maxLength: 500}}}
    Rect: {type: object,required: [x,y,w,h],properties: {x: {type: number,minimum: 0,maximum: 1},y: {type: number,minimum: 0,maximum: 1},w: {type: number,minimum: 0,maximum: 1},h: {type: number,minimum: 0,maximum: 1}}}
    Anchor: {type: object,properties: {cssSegments: {type: array,items: {type: string}},xpath: {type: string},beforeText: {type: string},insideText: {type: string},afterText: {type: string},tag: {type: string},role: {type: string},aria: {type: string},fingerprint: {type: string},rect: {$ref: '#/components/schemas/Rect'}}}
    CreateTicket: {type: object,required: [text,priority,page],properties: {text: {type: string,minLength: 1,maxLength: 4000},priority: {type: integer,minimum: 1,maximum: 5},dueDate: {type: [string,'null'],format: date},page: {$ref: '#/components/schemas/Page'},anchor: {$ref: '#/components/schemas/Anchor'},selection: {$ref: '#/components/schemas/Rect'},context: {type: object,additionalProperties: true}}}
    UpdateTicket: {type: object,properties: {text: {type: string,minLength: 1,maxLength: 4000},specification: {type: string,maxLength: 20000},priority: {type: integer,minimum: 1,maximum: 5},dueDate: {type: [string,'null'],format: date},status: {$ref: '#/components/schemas/TicketStatus'}}}
    Ticket: {allOf: [{$ref: '#/components/schemas/CreateTicket'},{type: object,required: [id,status,version,createdAt,updatedAt],properties: {id: {type: string,format: uuid},status: {$ref: '#/components/schemas/TicketStatus'},version: {type: integer},specification: {type: string},createdAt: {type: string,format: date-time},updatedAt: {type: string,format: date-time}}}]}
    TicketDetail: {allOf: [{$ref: '#/components/schemas/Ticket'},{type: object,required: [events,attachments,permissions],properties: {events: {type: array,items: {type: object,additionalProperties: true}},attachments: {type: array,items: {type: object,additionalProperties: true}},batch: {type: [object,'null'],additionalProperties: true},permissions: {type: array,items: {type: string}}}}]}
    CreateTenant: {type: object,additionalProperties: false,required: [name,projectName,projectKey],properties: {name: {type: string,minLength: 1},projectName: {type: string,minLength: 1},projectKey: {type: string,minLength: 1}}}
    CreateProject: {type: object,additionalProperties: false,required: [tenantId,name,projectKey],properties: {tenantId: {type: string,format: uuid},name: {type: string,minLength: 1},projectKey: {type: string,minLength: 1}}}
    ProjectRef: {type: object,required: [tenantId,projectId,projectKey,name,role],properties: {tenantId: {type: string,format: uuid},projectId: {type: string,format: uuid},projectKey: {type: string},name: {type: string},role: {type: string}}}
    Identity: {type: object,required: [principal,projects,platformAdmin],properties: {principal: {type: object,additionalProperties: true},projects: {type: array,items: {$ref: '#/components/schemas/ProjectRef'}},platformAdmin: {type: boolean}}}
    Origin: {type: object,additionalProperties: false,required: [origin],properties: {origin: {type: string,format: uri}}}
    Member: {type: object,required: [userId,email,role,owner],properties: {userId: {type: string,format: uuid},email: {type: string,format: email},role: {type: string,enum: [owner,admin,triager,reporter]},owner: {type: boolean}}}
    ProjectSettings: {type: object,required: [tenantId,id,projectKey,name,role,origins,members],properties: {tenantId: {type: string,format: uuid},id: {type: string,format: uuid},projectKey: {type: string},name: {type: string},role: {type: string},origins: {type: array,items: {$ref: '#/components/schemas/Origin'}},members: {type: array,items: {$ref: '#/components/schemas/Member'}}}}
    AcceptInvitation: {type: object,additionalProperties: false,required: [code],properties: {code: {type: string,minLength: 1}}}
    CreateInvitation: {type: object,additionalProperties: false,required: [email,role],properties: {email: {type: string,format: email},role: {type: string,enum: [admin,triager,reporter]}}}
    Invitation: {type: object,required: [id,url,expiresAt],properties: {id: {type: string,format: uuid},url: {type: string,format: uri},expiresAt: {type: string,format: date-time}}}
    ProjectMembership: {type: object,required: [tenantId,projectId,role],properties: {tenantId: {type: string,format: uuid},projectId: {type: string,format: uuid},role: {type: string}}}
    UpdateMember: {type: object,additionalProperties: false,required: [role],properties: {role: {type: string,enum: [admin,triager,reporter]}}}
    TokenInfo: {type: object,required: [id,prefix,scopes],properties: {id: {type: string,format: uuid},prefix: {type: string},scopes: {type: array,items: {type: string}},expiresAt: {type: [string,'null'],format: date-time},revokedAt: {type: [string,'null'],format: date-time},lastUsedAt: {type: [string,'null'],format: date-time}}}
    TokenSecret: {allOf: [{$ref: '#/components/schemas/TokenInfo'},{type: object,required: [secret],properties: {secret: {type: string}}}]}
    CreateToken: {type: object,additionalProperties: false,required: [scopes],properties: {scopes: {type: array,minItems: 1,items: {type: string,enum: ['tickets:read','tickets:claim','tickets:comment','tickets:complete']}},expiresAt: {type: [string,'null'],format: date-time}}}
    EmbedTokenRequest: {type: object,additionalProperties: false,required: [projectKey,code,verifier],properties: {projectKey: {type: string},code: {type: string},verifier: {type: string}}}
    EmbedTokenResponse: {type: object,required: [accessToken,expiresIn,projectId],properties: {accessToken: {type: string},expiresIn: {type: integer,const: 300},projectId: {type: string,format: uuid}}}
    Error: {type: object,required: [code,message,requestId],properties: {code: {type: string},message: {type: string},requestId: {type: string},details: {type: object,additionalProperties: true}}}
