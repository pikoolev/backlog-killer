server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_PUBLIC_URL} ${OIDC_PUBLIC_URL}; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'" always;
  location = /sdk/backlog-killer.js {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
